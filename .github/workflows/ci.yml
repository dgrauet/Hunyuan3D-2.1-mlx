name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    # arm64 runner — MLX requires Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hy3dshape/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlx mlx-arsenal numpy Pillow pytest opencv-python-headless

      - name: Run MLX unit tests
        # e2e tests need converted weights + a real GPU budget — unit suite only
        run: |
          python -m pytest -q hy3dpaint/tests \
            --ignore=hy3dpaint/tests/test_e2e_paint.py \
            --ignore=hy3dpaint/tests/test_e2e_mesh.py

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install commitizen
          cz check --rev-range "origin/${BASE_REF}..HEAD"
